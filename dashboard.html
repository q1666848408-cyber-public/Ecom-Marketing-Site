<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <aside class="sidebar">
        <div class="sidebar-logo">AI<span>Ecom</span></div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active"><i class="fas fa-home"></i> Overview</a>
            <a href="#" class="nav-item"><i class="fas fa-video"></i> My Videos</a>
            <a href="#" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <h1>Welcome back!</h1>
            <button class="create-btn"><i class="fas fa-plus"></i> New Video</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Videos Generated</span>
                <span class="stat-value">142</span>
                <span class="stat-change positive">+12 this week</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total Views</span>
                <span class="stat-value">84.2K</span>
                <span class="stat-change positive">+8.3%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Avg. Engagement</span>
                <span class="stat-value">6.8%</span>
                <span class="stat-change positive">+0.4%</span>
            </div>
        </div>
    </main>
</body>
</html>
