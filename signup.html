<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo">AI<span>Ecom</span></a>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Start your free trial today</p>
            <form class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Min. 8 characters" required>
                </div>
                <button type="submit" class="submit-btn">Get Started Free →</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="#">Log in</a></p>
        </div>
    </div>
</body>
</html>
